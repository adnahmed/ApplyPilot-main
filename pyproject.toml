[project]
name = "applypilot"
version = "0.2.0"
description = "AI-powered end-to-end job application pipeline"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "temporalio>=1.33,<2",
    "litellm>=1.98,<1.99",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgembed==0.2.0",
    "pg-configurator==0.11.0",
    "filelock>=3.16,<4",
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "PyGithub>=2.8,<3",
    "cryptography>=46",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "cloakbrowser==0.5.6", # Required host social-login browser; binary is cached on first use
    "patchright>=1.50",
    "python-dotenv>=1.2.2", # CVE-2026-28684
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
    "pandas>=2.0",
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
    "hmmlearn>=0.3.3,<0.4",
    "scikit-learn>=1.5,<2",
    "mcp>=1.28,<2",
    "starlette>=0.41,<2",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.22,<1",
    "openpyxl>=3.1.5,<4",
    "sse-starlette>=3.4,<4",
    "uvicorn>=0.31,<1",
    "watchfiles>=1.0,<2", # Native notifications for file-backed configuration/setup/backup changes
    "psutil>=7.0,<8", # Process identity and owned browser cleanup
    "python-jobspy==1.1.82",
    "openai>=1.0",
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.2.156,<0.3",
    "markdownify>=0.13.1,<0.14.0",
    "websocket-client>=1.0",
    "python-docx>=1.1",
    "pypdf>=6.13.3", # CVE-2026-48156/48155/48735/49461/49460/54531/54530 + GHSA-jm82-fx9c-mx94
    "instructor>=1.17.0,<2",
    "pydantic>=2.8.2,<3",
    "dspy[optuna]==3.3.1",
    "rlms==0.1.3",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
proxy = ["litellm[proxy]>=1.98.0,<1.99", "socksio>=1.0,<2", "fastjsonschema>=2.19,<3"]

[project.scripts]
applypilot = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/ibarrajo/ApplyPilot"
Repository = "https://github.com/ibarrajo/ApplyPilot"
Issues = "https://github.com/ibarrajo/ApplyPilot/issues"

[build-system]
requires = ["hatchling", "go-bin==1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/build_backup_tools.py"

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml", "src/applypilot/config/**/*.md", "src/applypilot/web/static/*", "src/applypilot/web/templates/**", "src/applypilot/config/postgres/*.sql", "src/applypilot/vendor/mycareer/**"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "scripts/build_backup_tools.py" },
    { file = "tools/rclone-githubreleases/go.mod" },
    { file = "tools/rclone-githubreleases/go.sum" },
    { file = "tools/rclone-githubreleases/main.go" },
    { file = "tools/rclone-githubreleases/backend/*.go" },
]

[tool.uv.sources]

[tool.ruff]
target-version = "py311"
line-length = 120
