  work_modes:
  - onsite
  - hybrid
- label: bahrain-preset
  countries:
  - BH
  work_modes:
  - onsite
  - hybrid
- label: uk-remote-preset
  countries:
  - GB
  work_modes:
  - remote
- label: ireland-remote-preset
  countries:
  - IE
  work_modes:
  - remote
- label: germany-remote-preset
  countries:
  - DE
  work_modes:
  - remote
- label: netherlands-remote-preset
  countries:
  - NL
  work_modes:
  - remote
- label: estonia-remote-preset
  countries:
  - EE
  work_modes:
  - remote
- label: singapore-remote-preset
  countries:
  - SG
  work_modes:
  - remote
- label: local-islamabad
  countries:
  - PK
  cities:
  - Islamabad
  work_modes:
  - onsite
  - hybrid
  employment_types:
  - full_time
  - contract
  requires_clearance: false
preferences:
- id: foreign-contractor-or-eor
  match:
    markets:
    - home-remote
    employer_scope: foreign
    engagements:
    - contractor
    - eor
- id: global-pay-remote
  match:
    markets:
    - home-remote
    pay_basis: global
- id: gulf-relocation
  match:
    markets:
    - relocation-uae
    - relocation-saudi
- id: uk-eu-worldwide-remote
  match:
    markets:
    - home-remote
    employer_regions:
    - uk
    - eu
    eligible_scope: worldwide
- id: localized-foreign-remote
  match:
    markets:
    - home-remote
    employer_scope: foreign
    pay_basis: localized
- id: local-work-floor
  match:
    markets:
    - local-islamabad
exploration:
  discovery_share: 0.15
  application_share: 0.1
probes:
- Full Stack Engineer
- Backend Engineer
- Frontend Engineer
- AI Engineer
- Software Engineer
- Platform Engineer
role_filter:
  include_any:
  - software engineer
  - software developer
  - full stack
  - fullstack
  - full-stack
  - backend
  - frontend
  - typescript
  - react
  - node.js
  - ai engineer
  - agentic ai
  - generative ai
  - llm engineer
  - platform engineer
  - infrastructure engineer
  exclude_any:
  - engineering manager
  - director of engineering
  - vice president
  - sales engineer
  - solutions consultant
variants:
- name: global-remote-high-comp
  market: global-remote
  salary_currency: USD
  salary_period: year
  salary_min: 84000

