# ApplyPilot target strategy example.
# Copy to ~/.applypilot/searches.yaml only after configuring discovery_runtime.yaml.
# Explicit sources still require their own authorization; browser/model/paid work
# remains disabled unless the runtime grants access and positive resource budgets.
# Countries below are applicant work-location targets, not employer HQ claims.
# Exploration shares are policy starting points, not measured hiring probabilities.
# Global pay requires evidence of location-independent pay; USD alone is insufficient.

schema_version: 2
sources:
  enabled:
  - jobspy
  - freehire
  - hiring_cafe
  - greenhouse
  - lever
  - ashby
  - ats_registry
  - workday
  - amazon
  - costco
  - builtin
  - hackernews
  - remotive
  - remoteok
  - reed
  - seek
  - irishjobs
  - ziprecruiter
  - linkedin_posts
  - twitter
  - smartextract
  - browseros_linkedin
jobspy:
  sites:
  - linkedin
  - indeed
  - glassdoor
  - google
  - zip_recruiter
  - naukri
  - bayt
  - bdjobs
tiers:
- 1
- 2
location_labels:
- home-remote
- global-remote
- relocation-uae
- relocation-saudi
- local-islamabad
locations:
- label: home-remote
  countries:
  - PK
  work_modes:
  - remote
  employment_types:
  - full_time
  - contract
  requires_clearance: false
- label: pakistan-onsite-preset
  countries:
  - PK
  work_modes:
  - onsite
  - hybrid
- label: global-remote
  regions:
  - global
  work_modes:
  - remote
  employment_types:
  - full_time
  - contract
  requires_clearance: false
- label: relocation-uae
  countries:
  - AE
  work_modes:
  - onsite
  - hybrid
  employment_types:
  - full_time
  requires_relocation: true
  requires_clearance: false
- label: relocation-saudi
