<form class="edit-form" hx-post="/ui/actions/targets/import-preview" hx-encoding="multipart/form-data" hx-target="#import-preview" hx-select="unset" hx-swap="innerHTML" hx-disabled-elt="find wa-button">
<fieldset {% if read_only %}disabled{% endif %}><legend>Add a spreadsheet</legend><label class="form-file">CSV or Excel file<input type="file" name="upload" accept=".csv,.tsv,.xlsx"></label><wa-textarea label="Or paste rows, including column headings" name="pasted" rows="8" placeholder="Company&#9;Website&#9;Email" value="" resize="vertical"></wa-textarea>
<h2>Defaults for this import</h2><div class="form-fields"><wa-select label="Action" name="action" required><wa-option value="" selected>Choose an action</wa-option>{% for key,label in target_actions.items() %}<wa-option value="{{ key }}">{{ label }}</wa-option>{% endfor %}</wa-select><wa-select label="Priority" name="priority"><wa-option value="high" selected>High</wa-option><wa-option value="normal">Normal</wa-option><wa-option value="low">Low</wa-option></wa-select><wa-select label="Check for openings" name="cadence"><wa-option value="daily" selected>Daily</wa-option><wa-option value="weekly">Weekly</wa-option><wa-option value="once">One time</wa-option></wa-select></div><wa-textarea label="Shared message guidance" name="instructions" rows="3" value="" resize="vertical"></wa-textarea><p class="muted">Nothing is queued until you confirm selected rows.</p><div data-errors role="alert"></div><wa-button type="submit" variant="brand" appearance="accent">Read spreadsheet</wa-button></fieldset></form><div id="import-preview"></div>
