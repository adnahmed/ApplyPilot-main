# Compatibility entry point: gateway source lives in the meta child repository.
include:
  - path: ../../gateway/compose.yaml
    project_directory: ../../gateway
    env_file: ../../gateway/.env

services:
  research-config:
    image: python:3.12-slim-bookworm
    command: ["python", "/init/init_searxng.py"]
    volumes:
      - ./source-tools/init_searxng.py:/init/init_searxng.py:ro
      - searxng-config:/config
    network_mode: none
    restart: "no"

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT:-8888}/"
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_LIMITER: "false"
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    depends_on:
      research-config:
        condition: service_completed_successfully
    networks: [local-research]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  source-tools:
    build:
      context: ../..
      dockerfile: docs/guides/source-tools/Dockerfile
      args:
        LINKEDIN_RS_REF: ${LINKEDIN_RS_REF:-main}
    image: ${APPLYPILOT_SOURCE_TOOLS_IMAGE:-applypilot-source-tools:local-v1}
    labels:
      org.applypilot.runtime: source-tools-v1
    init: true
    restart: unless-stopped
    shm_size: 512mb
    mem_limit: 4g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [local-research]

  operations-exporter:
    build:
      context: ../..
      dockerfile: docs/guides/monitoring/Dockerfile.operations
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    profiles: ["operations"]
    environment:
      APPLYPILOT_DATABASE_URL: "${APPLYPILOT_OPERATIONS_DATABASE_URL:-}"
      APPLYPILOT_DIR: /workspace
    volumes:
      - type: bind
        source: "${APPLYPILOT_DIR:-${USERPROFILE:-${HOME}}/.applypilot}/operations"
        target: /workspace/operations
        read_only: true
        bind:
          create_host_path: false
    tmpfs: [/tmp]

volumes:
  searxng-config:
  searxng-cache:
networks:
  local-research:
