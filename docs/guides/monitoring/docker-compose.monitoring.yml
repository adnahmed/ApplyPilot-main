services:
  operations-exporter:
    build:
      context: ../../..
      dockerfile: docs/guides/monitoring/Dockerfile.operations
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # Deliberately no published port, no job DB, no credentials and no dashboard token.
    volumes:
      - type: bind
        source: "${APPLYPILOT_DIR:-${USERPROFILE:-${HOME}}/.applypilot}/operations"
        target: /workspace/operations
        read_only: true
        bind:
          create_host_path: false
    tmpfs: [/tmp]

  prometheus-token-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "/init/init_metrics_token.sh"]
    network_mode: none
    read_only: true
    volumes:
      - type: bind
        source: .
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - litellm-metrics-token:/token
      - ../../../gateway/monitoring/init_metrics_token.sh:/init/init_metrics_token.sh:ro
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../gateway/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - litellm-metrics-token:/run/secrets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      prometheus-token-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../../../gateway/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  litellm-metrics-token:
  grafana-data:
